<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Shield Poster Viewer</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #05080a;
            --panel: rgba(11, 16, 20, 0.88);
            --border: rgba(255, 255, 255, 0.08);
            --text: #f3f7f2;
            --muted: rgba(243, 247, 242, 0.7);
            --accent: #6dfc8c;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            font-family: Georgia, 'Times New Roman', serif;
            background:
                radial-gradient(circle at top, rgba(109, 252, 140, 0.12), transparent 38%),
                linear-gradient(180deg, #081015 0%, var(--bg) 58%);
            color: var(--text);
            overflow: hidden;
        }

        .viewer-shell {
            position: relative;
            min-height: 100vh;
            min-height: 100dvh;
        }

        .viewer-toolbar {
            position: fixed;
            top: 12px;
            right: 12px;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 10px;
            flex-wrap: nowrap;
            padding: 8px;
            border-radius: 999px;
            background: var(--panel);
            border: 1px solid var(--border);
            -webkit-backdrop-filter: blur(12px);
            backdrop-filter: blur(12px);
        }

        .viewer-copy {
            display: none;
        }

        .viewer-label {
            margin: 0;
            font-family: 'Courier New', monospace;
            font-size: 0.76rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--accent);
        }

        .viewer-title {
            margin: 0;
            font-size: clamp(1.05rem, 2vw, 1.5rem);
        }

        .viewer-actions {
            display: flex;
            gap: 10px;
            flex-wrap: nowrap;
        }

        .viewer-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 38px;
            padding: 0 14px;
            border-radius: 999px;
            border: 1px solid var(--border);
            color: var(--text);
            text-decoration: none;
            background: rgba(255, 255, 255, 0.04);
            font-size: 0.92rem;
        }

        .viewer-link:hover {
            border-color: rgba(109, 252, 140, 0.38);
        }

        .viewer-stage {
            min-height: 100vh;
            min-height: 100dvh;
            display: grid;
            place-items: center;
            padding: 0;
        }

        .viewer-figure {
            margin: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            display: grid;
            place-items: center;
            gap: 0;
        }

        .viewer-image {
            display: block;
            width: auto;
            height: 100vh;
            height: 100dvh;
            max-width: 100vw;
            max-height: 100vh;
            max-height: 100dvh;
            object-fit: contain;
            border-radius: 0;
            box-shadow: none;
            background: transparent;
        }

        .viewer-caption {
            display: none;
        }

        .viewer-empty {
            text-align: center;
            display: grid;
            gap: 12px;
            padding: 32px;
            border-radius: 24px;
            background: var(--panel);
            border: 1px solid var(--border);
        }

        @media (max-width: 720px) {
            .viewer-toolbar {
                top: 10px;
                right: 10px;
                padding: 6px;
                max-width: calc(100vw - 20px);
            }

            .viewer-actions {
                width: auto;
                max-width: 100%;
            }

            .viewer-link {
                flex: 0 1 auto;
                min-height: 34px;
                padding: 0 12px;
                font-size: 0.84rem;
            }

            .viewer-image {
                width: 100vw;
                height: auto;
                max-width: 100vw;
                max-height: 100dvh;
            }
        }
    </style>
</head>
<body>
    <main class="viewer-shell">
        <header class="viewer-toolbar">
            <div class="viewer-copy">
                <p class="viewer-label">Poster Viewer</p>
                <h1 class="viewer-title" id="viewerTitle">Loading image...</h1>
            </div>
            <div class="viewer-actions">
                <a class="viewer-link" id="openOriginal" href="#" target="_blank" rel="noopener">Open original</a>
                <a class="viewer-link" id="downloadPoster" href="#" download>Download</a>
            </div>
        </header>
        <section class="viewer-stage" id="viewerStage"></section>
    </main>
    <script>
        (() => {
            const params = new URLSearchParams(window.location.search);
            const src = params.get('src');
            const alt = params.get('alt') || 'Cyber Shield poster';
            const title = document.getElementById('viewerTitle');
            const stage = document.getElementById('viewerStage');
            const openOriginal = document.getElementById('openOriginal');
            const downloadPoster = document.getElementById('downloadPoster');

            if (!src) {
                title.textContent = 'Image unavailable';
                stage.innerHTML = '<div class="viewer-empty"><h2>No image selected</h2><p>Return to Cyber Shield and open a poster again.</p></div>';
                openOriginal.removeAttribute('href');
                downloadPoster.removeAttribute('href');
                return;
            }

            const resolvedSrc = new URL(src, window.location.href);
            const figure = document.createElement('figure');
            const image = document.createElement('img');
            const caption = document.createElement('figcaption');

            figure.className = 'viewer-figure';
            image.className = 'viewer-image';
            image.src = resolvedSrc.toString();
            image.alt = alt;

            caption.className = 'viewer-caption';
            caption.textContent = alt;

            title.textContent = alt;
            openOriginal.href = resolvedSrc.toString();
            downloadPoster.href = resolvedSrc.toString();

            figure.append(image, caption);
            stage.replaceChildren(figure);
        })();
    </script>
</body>
</html>
